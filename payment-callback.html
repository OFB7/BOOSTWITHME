<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment — BOOSTWITHME</title><link rel="stylesheet" href="/styles.css"></head><body><main class="callback"><div class="panel"><p class="eyebrow">BOOSTWITHME</p><h1 id="title">Checking payment…</h1><p id="message">We’re verifying the transaction securely with the payment provider.</p><a class="btn primary" href="/">Return to BOOSTWITHME</a></div></main><script>async function check(){const ref=new URLSearchParams(location.search).get('reference');const title=document.querySelector('#title'),msg=document.querySelector('#message');if(!ref){title.textContent='Payment status';msg.textContent='No payment reference was returned. You can return to your dashboard and check the order status.';return}try{const r=await fetch('/api/payments/paystack/verify?reference='+encodeURIComponent(ref),{credentials:'include'});const d=await r.json();if(!r.ok)throw new Error(d.error||'Verification failed');if(d.verified){title.textContent='Payment verified';msg.textContent='Your payment has been verified and your order is now processing.'}else{title.textContent='Payment not confirmed yet';msg.textContent='We could not confirm this transaction yet. Your order will remain protected until payment is verified.'}}catch(e){title.textContent='Verification pending';msg.textContent=e.message}}check();</script></body></html>
